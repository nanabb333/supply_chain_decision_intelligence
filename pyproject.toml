[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "supply-chain-week1"
version = "0.1.0"
description = "M5 sales analytics and ABC-XYZ segmentation"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "duckdb>=1.1,<2", "pyarrow>=17", "streamlit>=1.50,<2", "plotly>=5.24,<8"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[project.scripts]
supply-chain = "supply_chain.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
